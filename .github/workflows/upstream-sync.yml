name: Upstream Sync

permissions:
  contents: write

on:
  schedule:
    - cron: '0 0 * * *'  # 每天 UTC 0:00 (北京时间 08:00) 自动同步
  workflow_dispatch:      # 支持在 GitHub Actions 页面手动一键触发

jobs:
  sync_latest_from_upstream:
    name: Sync latest commits from upstream repo
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout target repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Sync upstream changes
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.4.3
        with:
          upstream_sync_repo: liuzi6612/nav
          upstream_sync_branch: main
          target_sync_branch: main
          target_repo_token: ${{ secrets.SYNC_TOKEN || secrets.GITHUB_TOKEN }}
          test_mode: false
